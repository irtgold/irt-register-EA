<style>

  * { box-sizing: border-box; }

  .vgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin: 0 0 4px; }
  .vcard { min-width: 0; }
  .vthumb { position: relative; display: block; width: 100%; margin: 0; padding: 0; aspect-ratio: 9 / 16; border: 1px solid var(--line); border-radius: 14px; overflow: hidden; background: #0b1630; cursor: pointer; }

  .vdur { position: absolute; right: 8px; bottom: 8px; background: rgba(0,0,0,.72); color: #fff; font-size: 12px; padding: 1px 7px; border-radius: 6px; }
  .vcap { margin-top: 7px; font-size: 13.5px; line-height: 1.4; }
  .vcap b { display: block; color: var(--brand); }
